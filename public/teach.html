<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Teacher — Bearded Tutor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

  #pdfCanvas {
    display: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    object-fit: contain;
  }

  #canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
    z-index: 1;
  }

  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }

  #controls button {
    font-size: 1.2rem;
    padding: 14px 28px;
    border: 2px solid #333;
    border-radius: 12px;
    background: #fff;
    color: #333;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.15s, color 0.15s;
  }

  #controls button:active {
    background: #333;
    color: #fff;
  }

  #controls button.active {
    background: #e74c3c;
    color: #fff;
    border-color: #e74c3c;
  }

  #pauseBtn.active {
    background: #e74c3c;
    color: #fff;
    border-color: #e74c3c;
  }

  /* --- Brush controls --- */
  #brushControls {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }

  .brush-row {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: center;
  }

  .size-btn {
    border: 2px solid transparent;
    border-radius: 50%;
    background: #f0f0f0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    width: 40px;
    height: 40px;
    transition: border-color 0.15s;
  }
  .size-btn.active { border-color: #2196F3; }

  .size-dot {
    border-radius: 50%;
    background: #333;
  }

  .color-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .color-btn.active { border-color: #2196F3; box-shadow: 0 0 0 2px #2196F3; }

  .eraser-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: #f0f0f0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #666;
    transition: border-color 0.15s, background 0.15s;
  }
  .eraser-btn.active { border-color: #e74c3c; background: #fde8e8; color: #e74c3c; }

  /* --- PDF controls --- */
  #pdfControls {
    position: fixed;
    top: 12px;
    left: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }

  .pdf-ctrl-row {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: center;
  }

  .pdf-btn {
    padding: 8px 14px;
    border: 2px solid #333;
    border-radius: 8px;
    background: #fff;
    color: #333;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  .pdf-btn:active { background: #333; color: #fff; }
  .pdf-btn.primary { background: #2196F3; color: #fff; border-color: #2196F3; }
  .pdf-btn.primary:hover { background: #1976D2; }
  .pdf-btn.danger { background: #e74c3c; color: #fff; border-color: #e74c3c; }
  .pdf-btn:disabled { opacity: 0.4; cursor: default; }

  #pageInfo {
    font-size: 0.85rem;
    font-weight: 600;
    color: #555;
    text-align: center;
    min-width: 60px;
  }

  #pdfInfo {
    font-size: 0.75rem;
    color: #888;
    text-align: center;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* --- PDF Picker modal --- */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.visible { display: flex; }

  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    max-width: 420px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal h2 { font-size: 1.2rem; margin-bottom: 16px; }
  .modal-close {
    float: right;
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: #888;
    padding: 0 4px;
  }

  .picker-item {
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s;
    text-transform: capitalize;
  }
  .picker-item:hover { background: #e3f2fd; }
  .picker-item + .picker-item { margin-top: 4px; }

  .picker-back {
    display: inline-block;
    margin-bottom: 12px;
    color: #2196F3;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
  }

  .picker-empty {
    color: #aaa;
    text-align: center;
    padding: 16px;
  }

  /* --- Canvas wrapper (receives CSS zoom/pan transform) --- */
  #canvasWrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    touch-action: none;
  }

  /* --- Calc indicator (loading / error) --- */
  #calcIndicator {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 10px 20px;
    border-radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    z-index: 30;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #calcIndicator.loading { background: rgba(33,150,243,0.85); color: #fff; opacity: 1; }
  #calcIndicator.error   { background: rgba(231,76,60,0.85); color: #fff; opacity: 1; }

  /* --- Zoom indicator --- */
  #zoomIndicator {
    position: fixed;
    bottom: 76px;
    right: 16px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="canvasWrap">
  <canvas id="pdfCanvas"></canvas>
  <canvas id="canvas"></canvas>
</div>
<div id="zoomIndicator"></div>
<div id="calcIndicator"></div>

<div id="brushControls">
  <div class="brush-row" id="sizeRow"></div>
  <div class="brush-row" id="colorRow"></div>
  <div class="brush-row"><button class="eraser-btn" id="eraserBtn" title="Eraser">ERS</button></div>
</div>

<div id="pdfControls">
  <div class="pdf-ctrl-row">
    <button class="pdf-btn primary" id="loadPdfBtn">Load PDF</button>
    <button class="pdf-btn" id="closePdfBtn" style="display:none">Close PDF</button>
  </div>
  <div class="pdf-ctrl-row" id="pageNav" style="display:none">
    <button class="pdf-btn" id="prevPageBtn" disabled>&larr;</button>
    <span id="pageInfo">1 / 1</span>
    <button class="pdf-btn" id="nextPageBtn">&rarr;</button>
  </div>
  <div id="pdfInfo"></div>
  <div class="pdf-ctrl-row" id="resetZoomRow" style="display:none">
    <button class="pdf-btn" id="resetZoomBtn">Reset Zoom</button>
  </div>
  <div class="pdf-ctrl-row" id="annoRow" style="display:none">
    <button class="pdf-btn danger" id="clearAnnoBtn">Clear Annotations</button>
  </div>
</div>

<div id="controls">
  <button id="pauseBtn">Pause</button>
  <button id="revealBtn">Reveal</button>
  <button id="undoBtn">Undo</button>
  <button id="clearBtn">Clear</button>
  <button id="calcBtn">Calc</button>
</div>

<!-- PDF Picker Modal -->
<div class="modal-overlay" id="pickerOverlay">
  <div class="modal">
    <button class="modal-close" id="pickerClose">&times;</button>
    <h2 id="pickerTitle">Choose Student</h2>
    <div id="pickerContent"></div>
  </div>
</div>

<script>
// --- PDF.js worker ---
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const pdfCanvas = document.getElementById('pdfCanvas');
const pdfCtx = pdfCanvas.getContext('2d');
const canvasWrap = document.getElementById('canvasWrap');
const zoomIndicatorEl = document.getElementById('zoomIndicator');

let strokes = [];
let currentStroke = [];
let drawing = false;
let paused = false;
let holdTimer = null;
let eraserMode = false;
let erasedAny = false;

// --- Zoom / pan state ---
let zoom = 1;
let panX = 0, panY = 0;

// --- PDF state ---
let pdfDoc = null;
let pdfPageNum = 1;
let pdfTotalPages = 0;
let pdfStudent = null;
let pdfFilename = null;
let savingAnnotations = false;

// --- Brush state ---
const SIZES = [
  { name: 'S', value: 2 },
  { name: 'M', value: 5 },
  { name: 'L', value: 10 },
  { name: 'XL', value: 20 },
];
const COLORS = [
  { name: 'Black', value: '#000000' },
  { name: 'Red', value: '#e74c3c' },
  { name: 'Blue', value: '#2196F3' },
  { name: 'Green', value: '#27ae60' },
  { name: 'Orange', value: '#f39c12' },
  { name: 'White', value: '#ffffff' },
];
let currentColor = COLORS[0].value;
let currentSize = SIZES[1].value;

// --- Hi-DPI support ---
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Also resize PDF canvas
  pdfCanvas.width = w * dpr;
  pdfCanvas.height = h * dpr;
  pdfCanvas.style.width = w + 'px';
  pdfCanvas.style.height = h + 'px';
  pdfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
  if (pdfDoc) renderPdfPage();
}
window.addEventListener('resize', resize);
resize();

// --- Zoom / pan helpers ---

// Convert a screen (clientX/Y) position to canvas logical coordinates
function toCanvas(clientX, clientY) {
  return { x: (clientX - panX) / zoom, y: (clientY - panY) / zoom };
}

// Normalise a stroke to 0–1 range for sending over the wire / saving to disk.
// Coordinates divided by viewport dimensions; size divided by viewport height.
function normaliseStroke(s) {
  const w = window.innerWidth, h = window.innerHeight;
  const out = { points: s.points.map(p => ({ x: p.x / w, y: p.y / h })), color: s.color, size: s.size / h };
  if (s.text) out.text = s.text;
  return out;
}

// Denormalise a stroke received from the wire / loaded from disk.
function denormaliseStroke(s) {
  const w = window.innerWidth, h = window.innerHeight;
  const out = { points: s.points.map(p => ({ x: p.x * w, y: p.y * h })), color: s.color, size: s.size * h };
  if (s.text) out.text = s.text;
  return out;
}

function applyTransform() {
  canvasWrap.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  const notDefault = zoom !== 1 || panX !== 0 || panY !== 0;
  document.getElementById('resetZoomRow').style.display = notDefault ? '' : 'none';
  sendViewport();
}

let zoomIndicatorTimer = null;
function showZoomIndicator() {
  zoomIndicatorEl.textContent = Math.round(zoom * 100) + '%';
  zoomIndicatorEl.style.opacity = '1';
  clearTimeout(zoomIndicatorTimer);
  zoomIndicatorTimer = setTimeout(() => { zoomIndicatorEl.style.opacity = '0'; }, 2000);
}

// Send the current viewport to students (throttled to ~30 fps during gestures)
let lastViewportSend = 0;
function sendViewport() {
  const now = Date.now();
  if (now - lastViewportSend < 32) return;
  lastViewportSend = now;
  if (ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'viewport', zoom, panX, panY }));
  }
}

// --- Drawing helpers ---
function drawStroke(stroke) {
  // Handle text strokes (from calculator answers)
  if (stroke.text) {
    const pt = stroke.points[0];
    ctx.save();
    ctx.font = `bold ${stroke.size}px -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.fillStyle = stroke.color || '#000';
    ctx.textBaseline = 'middle';
    ctx.fillText(stroke.text, pt.x, pt.y);
    ctx.restore();
    return;
  }

  const pts = stroke.points || stroke;
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.strokeStyle = stroke.color || '#000';
  ctx.lineWidth = stroke.size || 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of strokes) drawStroke(s);
}

// --- Eraser helpers ---

function updateEraserCursor() {
  const r = Math.max(10, currentSize * 2);
  const s = r * 2 + 2;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><circle cx='${r+1}' cy='${r+1}' r='${r}' fill='none' stroke='%23999' stroke-width='1.5'/></svg>`;
  canvas.style.cursor = `url("data:image/svg+xml,${svg}") ${r+1} ${r+1}, crosshair`;
}

// Check if a point (px, py) with radius hits any segment of a stroke
function strokeIntersectsPoint(stroke, px, py, radius) {
  if (stroke.text) {
    const tp = stroke.points[0];
    const textW = stroke.size * String(stroke.text).length * 0.6;
    return px > tp.x - radius && px < tp.x + textW + radius && Math.abs(py - tp.y) < stroke.size / 2 + radius;
  }
  const pts = stroke.points || [];
  const halfW = (stroke.size || 2.5) / 2;
  for (let i = 0; i < pts.length - 1; i++) {
    if (distToSegment({ x: px, y: py }, pts[i], pts[i + 1]) < radius + halfW) return true;
  }
  if (pts.length === 1 && Math.hypot(pts[0].x - px, pts[0].y - py) < radius + halfW) return true;
  return false;
}

function checkEraserAt(pt) {
  const eraserR = Math.max(10, currentSize * 2);
  let removed = false;
  for (let i = strokes.length - 1; i >= 0; i--) {
    if (strokeIntersectsPoint(strokes[i], pt.x, pt.y, eraserR)) {
      strokes.splice(i, 1);
      removed = true;
    }
  }
  if (removed) {
    erasedAny = true;
    redraw();
  }
}

// --- Pointer events ---
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;
  e.preventDefault();
  // Cancel any pending shape recognition — pen is back down
  if (holdTimer !== null) {
    clearTimeout(holdTimer);
    holdTimer = null;
  }
  drawing = true;
  canvas.setPointerCapture(e.pointerId);

  if (eraserMode) {
    erasedAny = false;
    checkEraserAt(toCanvas(e.clientX, e.clientY));
  } else {
    currentStroke = [toCanvas(e.clientX, e.clientY)];
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  e.preventDefault();

  if (eraserMode) {
    checkEraserAt(toCanvas(e.clientX, e.clientY));
    return;
  }

  const pt = toCanvas(e.clientX, e.clientY);
  currentStroke.push(pt);
  if (currentStroke.length >= 2) {
    const prev = currentStroke[currentStroke.length - 2];
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(pt.x, pt.y);
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (!drawing) return;
  e.preventDefault();
  drawing = false;

  if (eraserMode) {
    if (erasedAny && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'erase', strokes: strokes.map(normaliseStroke) }));
      saveAnnotations();
    }
    return;
  }

  if (currentStroke.length > 1) {
    const stroke = { points: currentStroke, color: currentColor, size: currentSize, _time: Date.now() };
    strokes.push(stroke);
    sendStroke(stroke);
    saveAnnotations();
    // Start 1-second hold timer: check for equals sign first,
    // then fall back to shape recognition.
    holdTimer = setTimeout(() => {
      holdTimer = null;
      if (detectEqualsSign()) {
        attemptCalculation();
      } else {
        attemptShapeRecognition();
      }
    }, 1000);
  }
  currentStroke = [];
});

canvas.addEventListener('pointercancel', () => {
  drawing = false;
  currentStroke = [];
});

// --- WebSocket ---
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}`);

ws.addEventListener('open', () => {
  ws.send(JSON.stringify({ type: 'register', role: 'teacher' }));
});

ws.addEventListener('message', async (e) => {
  const msg = JSON.parse(e.data);

  if (msg.type === 'paused') {
    paused = true;
    pauseBtn.classList.add('active');
    pauseBtn.textContent = 'Paused';
  }

  if (msg.type === 'calculate_result') {
    clearTimeout(calcTimeoutId);
    hideCalcIndicator();
    drawAnswerOnCanvas(msg.answer, msg.x, msg.y);
  }

  if (msg.type === 'calculate_error') {
    clearTimeout(calcTimeoutId);
    calcWaiting = false;
    calcBtn.textContent = 'Calc';
    showCalcIndicator('Could not calculate', 'error');
    setTimeout(hideCalcIndicator, 2000);
  }

  if (msg.type === 'init') {
    // Restore strokes from server state (e.g. after a page refresh)
    strokes = (msg.strokes || []).map(denormaliseStroke);
    redraw();

    // Restore paused state
    if (msg.paused) {
      paused = true;
      pauseBtn.classList.add('active');
      pauseBtn.textContent = 'Paused';
    }

    // Restore PDF display without sending pdf-load back to the server
    if (msg.currentPdf && msg.currentPdf.student && msg.currentPdf.filename) {
      await restorePdfDisplay(
        msg.currentPdf.student,
        msg.currentPdf.filename,
        msg.currentPdf.page || 1,
        msg.currentPdf.totalPages || 0
      );
    }
  }
});

function sendStroke(stroke) {
  if (ws.readyState === 1) {
    const n = normaliseStroke(stroke);
    ws.send(JSON.stringify({ type: 'stroke', points: n.points, color: n.color, size: n.size, text: n.text }));
  }
}

function getSnapshot() {
  return canvas.toDataURL('image/png');
}

// --- Buttons ---
const pauseBtn = document.getElementById('pauseBtn');
const revealBtn = document.getElementById('revealBtn');
const undoBtn = document.getElementById('undoBtn');
const clearBtn = document.getElementById('clearBtn');

pauseBtn.addEventListener('click', () => {
  if (!paused) {
    paused = true;
    pauseBtn.classList.add('active');
    pauseBtn.textContent = 'Paused';
    ws.send(JSON.stringify({ type: 'pause', snapshot: getSnapshot() }));
  }
});

revealBtn.addEventListener('click', () => {
  paused = false;
  pauseBtn.classList.remove('active');
  pauseBtn.textContent = 'Pause';
  ws.send(JSON.stringify({ type: 'reveal', snapshot: getSnapshot() }));
});

undoBtn.addEventListener('click', () => {
  if (strokes.length === 0) return;
  strokes.pop();
  redraw();
  ws.send(JSON.stringify({ type: 'undo' }));
  saveAnnotations();
});

clearBtn.addEventListener('click', () => {
  strokes = [];
  redraw();
  ws.send(JSON.stringify({ type: 'clear' }));
  saveAnnotations();
});

// --- Build brush controls ---
const sizeRow = document.getElementById('sizeRow');
const colorRow = document.getElementById('colorRow');

SIZES.forEach((s) => {
  const btn = document.createElement('button');
  btn.className = 'size-btn' + (s.value === currentSize ? ' active' : '');
  btn.title = s.name;
  const dot = document.createElement('span');
  dot.className = 'size-dot';
  const d = Math.max(6, Math.min(s.value, 24));
  dot.style.width = d + 'px';
  dot.style.height = d + 'px';
  btn.appendChild(dot);
  btn.addEventListener('click', () => {
    currentSize = s.value;
    sizeRow.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
  sizeRow.appendChild(btn);
});

COLORS.forEach((c) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (c.value === currentColor ? ' active' : '');
  btn.style.background = c.value;
  btn.title = c.name;
  btn.addEventListener('click', () => {
    currentColor = c.value;
    colorRow.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Exit eraser mode when a colour is selected
    eraserMode = false;
    document.getElementById('eraserBtn').classList.remove('active');
    canvas.style.cursor = 'crosshair';
  });
  colorRow.appendChild(btn);
});

// --- Eraser button ---
document.getElementById('eraserBtn').addEventListener('click', () => {
  eraserMode = !eraserMode;
  const btn = document.getElementById('eraserBtn');
  btn.classList.toggle('active', eraserMode);
  if (eraserMode) {
    updateEraserCursor();
  } else {
    canvas.style.cursor = 'crosshair';
  }
});

// PDF LOADING & RENDERING
// =====================================================
const loadPdfBtn = document.getElementById('loadPdfBtn');
const closePdfBtn = document.getElementById('closePdfBtn');
const pageNav = document.getElementById('pageNav');
const prevPageBtn = document.getElementById('prevPageBtn');
const nextPageBtn = document.getElementById('nextPageBtn');
const pageInfo = document.getElementById('pageInfo');
const pdfInfo = document.getElementById('pdfInfo');
const annoRow = document.getElementById('annoRow');
const clearAnnoBtn = document.getElementById('clearAnnoBtn');
const pickerOverlay = document.getElementById('pickerOverlay');
const pickerClose = document.getElementById('pickerClose');
const pickerTitle = document.getElementById('pickerTitle');
const pickerContent = document.getElementById('pickerContent');

// --- PDF Picker ---
loadPdfBtn.addEventListener('click', openPicker);
pickerClose.addEventListener('click', () => pickerOverlay.classList.remove('visible'));
pickerOverlay.addEventListener('click', (e) => { if (e.target === pickerOverlay) pickerOverlay.classList.remove('visible'); });

async function openPicker() {
  pickerTitle.textContent = 'Choose Student';
  pickerContent.innerHTML = '';
  const res = await fetch('/api/students');
  const students = await res.json();
  if (students.length === 0) {
    pickerContent.innerHTML = '<div class="picker-empty">No students. Add them in the Library.</div>';
    pickerOverlay.classList.add('visible');
    return;
  }
  for (const s of students) {
    const div = document.createElement('div');
    div.className = 'picker-item';
    div.textContent = s;
    div.addEventListener('click', () => showStudentPdfs(s));
    pickerContent.appendChild(div);
  }
  pickerOverlay.classList.add('visible');
}

async function showStudentPdfs(student) {
  pickerTitle.textContent = student + "'s PDFs";
  pickerContent.innerHTML = '<span class="picker-back" id="pickerBack">&larr; Back</span>';
  document.getElementById('pickerBack').addEventListener('click', openPicker);

  const res = await fetch(`/api/students/${encodeURIComponent(student)}/pdfs`);
  const pdfs = await res.json();
  if (pdfs.length === 0) {
    pickerContent.innerHTML += '<div class="picker-empty">No PDFs. Upload them in the Library.</div>';
    return;
  }
  for (const pdf of pdfs) {
    const div = document.createElement('div');
    div.className = 'picker-item';
    div.textContent = pdf;
    div.addEventListener('click', () => loadPdf(student, pdf));
    pickerContent.appendChild(div);
  }
}

// --- Restore PDF display after a page refresh (no WS messages sent) ---
async function restorePdfDisplay(student, filename, page, totalPages) {
  pdfStudent = student;
  pdfFilename = filename;
  pdfPageNum = page;

  const url = `/uploads/${encodeURIComponent(student)}/${encodeURIComponent(filename)}`;
  try {
    pdfDoc = await pdfjsLib.getDocument(url).promise;
  } catch (err) {
    console.error('Failed to restore PDF:', err);
    return;
  }
  pdfTotalPages = totalPages || pdfDoc.numPages;

  pdfCanvas.style.display = 'block';
  closePdfBtn.style.display = '';
  pageNav.style.display = '';
  annoRow.style.display = '';
  pdfInfo.textContent = student + ' / ' + filename;

  await renderPdfPage();
  // Strokes already restored from init — just redraw them over the PDF
  redraw();
}

// --- Load PDF ---
async function loadPdf(student, filename) {
  pickerOverlay.classList.remove('visible');
  pdfStudent = student;
  pdfFilename = filename;

  const url = `/uploads/${encodeURIComponent(student)}/${encodeURIComponent(filename)}`;
  const loadingTask = pdfjsLib.getDocument(url);
  pdfDoc = await loadingTask.promise;
  pdfTotalPages = pdfDoc.numPages;
  pdfPageNum = 1;

  // Show PDF UI
  pdfCanvas.style.display = 'block';
  closePdfBtn.style.display = '';
  pageNav.style.display = '';
  annoRow.style.display = '';
  pdfInfo.textContent = student + ' / ' + filename;

  // Notify server & students
  ws.send(JSON.stringify({
    type: 'pdf-load',
    student,
    filename,
    page: 1,
    totalPages: pdfTotalPages,
  }));

  await renderPdfPage();
  await loadAnnotations();
}

// --- Render PDF page ---
async function renderPdfPage() {
  if (!pdfDoc) return;
  const page = await pdfDoc.getPage(pdfPageNum);
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const pdfViewport = page.getViewport({ scale: 1 });
  const scale = Math.min(vw / pdfViewport.width, vh / pdfViewport.height);
  const viewport = page.getViewport({ scale });

  const dpr = window.devicePixelRatio || 1;
  pdfCanvas.width = vw * dpr;
  pdfCanvas.height = vh * dpr;
  pdfCanvas.style.width = vw + 'px';
  pdfCanvas.style.height = vh + 'px';

  const renderCtx = pdfCanvas.getContext('2d');
  renderCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderCtx.clearRect(0, 0, vw, vh);

  // Center the PDF on the canvas
  const offsetX = (vw - viewport.width) / 2;
  const offsetY = (vh - viewport.height) / 2;
  renderCtx.translate(offsetX, offsetY);

  await page.render({
    canvasContext: renderCtx,
    viewport,
  }).promise;

  updatePageUI();
}

function updatePageUI() {
  pageInfo.textContent = pdfPageNum + ' / ' + pdfTotalPages;
  prevPageBtn.disabled = pdfPageNum <= 1;
  nextPageBtn.disabled = pdfPageNum >= pdfTotalPages;
}

// --- Page navigation ---
prevPageBtn.addEventListener('click', () => changePage(pdfPageNum - 1));
nextPageBtn.addEventListener('click', () => changePage(pdfPageNum + 1));

async function changePage(num) {
  if (!pdfDoc || num < 1 || num > pdfTotalPages) return;
  // Save current page annotations before changing
  await saveAnnotations();
  pdfPageNum = num;
  strokes = [];
  redraw();
  await renderPdfPage();
  await loadAnnotations();

  ws.send(JSON.stringify({ type: 'pdf-page', page: pdfPageNum }));
}

// --- Close PDF ---
closePdfBtn.addEventListener('click', async () => {
  await saveAnnotations();
  pdfDoc = null;
  pdfStudent = null;
  pdfFilename = null;
  pdfPageNum = 1;
  pdfTotalPages = 0;
  strokes = [];
  redraw();

  pdfCanvas.style.display = 'none';
  const dpr = window.devicePixelRatio || 1;
  pdfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pdfCtx.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);

  closePdfBtn.style.display = 'none';
  pageNav.style.display = 'none';
  annoRow.style.display = 'none';
  pdfInfo.textContent = '';

  ws.send(JSON.stringify({ type: 'pdf-unload' }));
});

// --- Clear annotations for current page ---
clearAnnoBtn.addEventListener('click', async () => {
  if (!pdfStudent || !pdfFilename) return;
  strokes = [];
  redraw();
  ws.send(JSON.stringify({ type: 'clear' }));
  await fetch(`/api/annotations/${encodeURIComponent(pdfStudent)}/${encodeURIComponent(pdfFilename)}/${pdfPageNum}`, {
    method: 'DELETE',
  });
});

// =====================================================
// ANNOTATION PERSISTENCE
// =====================================================
async function saveAnnotations() {
  if (!pdfStudent || !pdfFilename || savingAnnotations) return;
  savingAnnotations = true;
  try {
    await fetch(`/api/annotations/${encodeURIComponent(pdfStudent)}/${encodeURIComponent(pdfFilename)}/${pdfPageNum}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ strokes: strokes.map(normaliseStroke) }),
    });
  } catch (err) {
    console.error('Failed to save annotations:', err);
  }
  savingAnnotations = false;
}

async function loadAnnotations() {
  if (!pdfStudent || !pdfFilename) return;
  try {
    const res = await fetch(`/api/annotations/${encodeURIComponent(pdfStudent)}/${encodeURIComponent(pdfFilename)}/${pdfPageNum}`);
    const data = await res.json();
    strokes = (data.strokes || []).map(denormaliseStroke);
    redraw();
    // Send to students too (normalised for the wire)
    if (strokes.length > 0) {
      ws.send(JSON.stringify({ type: 'reveal', snapshot: null, strokes: strokes.map(normaliseStroke) }));
    }
  } catch (err) {
    console.error('Failed to load annotations:', err);
  }
}

// =====================================================
// SHAPE RECOGNITION (Draw and Hold)
// =====================================================

function ptDist(a, b) {
  return Math.hypot(b.x - a.x, b.y - a.y);
}

function arcLength(pts) {
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += ptDist(pts[i - 1], pts[i]);
  return len;
}

// Resample stroke to n evenly-spaced points along its arc
function resample(pts, n) {
  const total = arcLength(pts);
  if (total === 0 || pts.length < 2) return pts;
  const step = total / (n - 1);
  const out = [{ ...pts[0] }];
  let travelled = 0;
  let pi = 0;
  for (let i = 1; i < n - 1; i++) {
    const target = i * step;
    while (pi < pts.length - 2) {
      const seg = ptDist(pts[pi], pts[pi + 1]);
      if (travelled + seg >= target) break;
      travelled += seg;
      pi++;
    }
    const seg = ptDist(pts[pi], pts[pi + 1]);
    const t = seg === 0 ? 0 : (target - travelled) / seg;
    out.push({
      x: pts[pi].x + t * (pts[pi + 1].x - pts[pi].x),
      y: pts[pi].y + t * (pts[pi + 1].y - pts[pi].y),
    });
  }
  out.push({ ...pts[pts.length - 1] });
  return out;
}

// Distance from point p to line segment a→b
function distToSegment(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return ptDist(p, a);
  const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2));
  return ptDist(p, { x: a.x + t * dx, y: a.y + t * dy });
}

// Turning angle at work[i] using a k-point window.
// Uses atan2(|cross|, dot) — correct without normalisation.
function turningAngle(work, i, k) {
  if (i < k || i + k >= work.length) return 0;
  const ax = work[i].x - work[i - k].x, ay = work[i].y - work[i - k].y;
  const bx = work[i + k].x - work[i].x, by = work[i + k].y - work[i].y;
  return Math.atan2(Math.abs(ax * by - ay * bx), ax * bx + ay * by);
}

// Find sharp corners (direction change > minAngleDeg) in a stroke.
// For closed strokes extends by 30 % so the corner at the seam is detectable.
// Returns { si, angle, pt }[] sorted by position.
function findSharpCorners(pts, minAngleDeg = 60) {
  const minAngle = minAngleDeg * Math.PI / 180;
  const k = 5, N = 80;
  const sampled = resample(pts, N);
  const isClosed = ptDist(pts[0], pts[pts.length - 1]) < 0.25 * arcLength(pts);
  const extLen = isClosed ? Math.round(N * 0.3) : 0;
  const work = isClosed ? [...sampled, ...sampled.slice(0, extLen)] : sampled;
  const wa = work.map((_, wi) => turningAngle(work, wi, k));
  const minSpacing = Math.max(6, Math.round(N / 10));
  const found = [];

  for (let wi = k + 1; wi < work.length - k - 1; wi++) {
    const angle = wa[wi];
    if (angle < minAngle) continue;
    if (angle <= wa[wi - 1] || angle <= wa[wi + 1]) continue;
    const si = wi % N;
    const dup = found.find(c => Math.min(Math.abs(c.si - si), N - Math.abs(c.si - si)) < minSpacing);
    if (dup) {
      if (angle > dup.angle) { dup.si = si; dup.angle = angle; dup.pt = sampled[si]; }
    } else {
      found.push({ si, angle, pt: sampled[si] });
    }
  }
  found.sort((a, b) => a.si - b.si);
  return found;
}

// --- Detector 1: Straight line ---
function detectLine(pts) {
  const first = pts[0], last = pts[pts.length - 1];
  const chord = ptDist(first, last);
  if (chord < 30) return null;
  const arc = arcLength(pts);
  const maxDev = Math.max(...pts.map(p => distToSegment(p, first, last)));
  if (maxDev < 0.08 * chord && arc < 1.3 * chord) {
    return { x1: first.x, y1: first.y, x2: last.x, y2: last.y };
  }
  return null;
}

// --- Detector 2: Circle ---
// Uses Kåsa's algebraic least-squares circle fit to find the true geometric
// centre and radius. Works correctly for partial arcs and C-shapes because
// it solves for the circle that best fits all points, regardless of how
// much of the circumference was actually drawn.
// After the fit, the same stdR / meanR < 0.25 variance check is applied.
function detectCircle(pts) {
  if (pts.length < 20) return null;

  // --- Geometric gating: reject handwriting-sized / wrong-aspect strokes ---
  const gateXs = pts.map(p => p.x), gateYs = pts.map(p => p.y);
  const bboxW = Math.max(...gateXs) - Math.min(...gateXs);
  const bboxH = Math.max(...gateYs) - Math.min(...gateYs);
  if (bboxW < 20 || bboxH < 20) return null; // too small — likely a character
  const aspect = bboxW / bboxH;
  if (aspect < 0.5 || aspect > 2.0) return null; // too narrow/wide — not circular

  const n = pts.length;

  // --- Kåsa least-squares circle fit ---
  // Minimises the algebraic distance  (x-cx)² + (y-cy)² - R²  over all points.
  // Reduces to solving a 3×3 linear system  A·[a,b,c]ᵀ = d  where
  //   cx = a/2,  cy = b/2,  R = sqrt(c + cx² + cy²).
  let Sx = 0, Sy = 0, Sxx = 0, Syy = 0, Sxy = 0, Sxxx = 0, Syyy = 0, Sxxy = 0, Sxyy = 0;
  for (const p of pts) {
    const x2 = p.x * p.x, y2 = p.y * p.y;
    Sx += p.x; Sy += p.y;
    Sxx += x2; Syy += y2; Sxy += p.x * p.y;
    Sxxx += x2 * p.x; Syyy += y2 * p.y;
    Sxxy += x2 * p.y; Sxyy += p.x * y2;
  }

  // System:  | Sxx Sxy Sx |   | a |   | Sxxx+Sxyy |
  //          | Sxy Syy Sy | × | b | = | Sxxy+Syyy |
  //          | Sx  Sy  n  |   | c |   | Sxx +Syy  |
  const A00 = Sxx, A01 = Sxy, A02 = Sx;
  const A10 = Sxy, A11 = Syy, A12 = Sy;
  const A20 = Sx,  A21 = Sy,  A22 = n;
  const d0 = Sxxx + Sxyy, d1 = Sxxy + Syyy, d2 = Sxx + Syy;

  // Solve via Cramer's rule
  const detA = A00*(A11*A22 - A12*A21) - A01*(A10*A22 - A12*A20) + A02*(A10*A21 - A11*A20);
  if (Math.abs(detA) < 1e-10) return null; // degenerate (collinear points)

  const a = ( d0*(A11*A22 - A12*A21) - A01*(d1*A22 - A12*d2) + A02*(d1*A21 - A11*d2) ) / detA;
  const b = ( A00*(d1*A22 - A12*d2) - d0*(A10*A22 - A12*A20) + A02*(A10*d2 - d1*A20) ) / detA;
  const c = ( A00*(A11*d2 - d1*A21) - A01*(A10*d2 - d1*A20) + d0*(A10*A21 - A11*A20) ) / detA;

  const cx = a / 2;
  const cy = b / 2;
  const rSq = c + cx * cx + cy * cy;
  if (rSq <= 0) return null;
  const fitR = Math.sqrt(rSq);
  if (fitR < 15) return null;

  // --- Radial variance check against the fitted centre ---
  const radii = pts.map(p => Math.hypot(p.x - cx, p.y - cy));
  const meanR = radii.reduce((s, r) => s + r, 0) / n;
  const stdR = Math.sqrt(radii.reduce((s, r) => s + (r - meanR) ** 2, 0) / n);
  const ratio = stdR / meanR;

  console.log(`[circle] least-squares fit: ratio=${ratio.toFixed(3)} (snaps if < 0.25)  points=${n}  fitR=${Math.round(fitR)}px  cx=${Math.round(cx)} cy=${Math.round(cy)}`);

  if (ratio > 0.25) return null;

  // Reject if 3+ sharp corners are present — that's a polygon, not a circle.
  const corners = findSharpCorners(pts, 70);
  console.log(`[circle] corners found at 70°: ${corners.length}`);
  if (corners.length >= 3) return null;

  return { cx, cy, rx: fitR, ry: fitR };
}

// --- Detector 3: Rectangle / Square ---
// Requires EXACTLY 4 sharp corners, each 50°–130° (roughly 90°).
function detectRect(pts) {
  if (ptDist(pts[0], pts[pts.length - 1]) > 0.25 * arcLength(pts)) return null;
  const corners = findSharpCorners(pts, 60);
  if (corners.length !== 4) return null;
  const lo = 50 * Math.PI / 180, hi = 130 * Math.PI / 180;
  if (!corners.every(c => c.angle >= lo && c.angle <= hi)) return null;
  return corners.map(c => c.pt);
}

// --- Detector 4: Triangle ---
// Requires EXACTLY 3 sharp corners.
function detectTriangle(pts) {
  if (ptDist(pts[0], pts[pts.length - 1]) > 0.25 * arcLength(pts)) return null;
  const corners = findSharpCorners(pts, 60);
  if (corners.length !== 3) return null;
  return corners.map(c => c.pt);
}

// --- Shape point generators ---

function linePoints(s) {
  return [{ x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 }];
}

function circlePoints(s, n = 80) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * 2 * Math.PI;
    pts.push({ x: s.cx + s.rx * Math.cos(a), y: s.cy + s.ry * Math.sin(a) });
  }
  return pts;
}

function rectPoints(corners) {
  const xs = corners.map(p => p.x), ys = corners.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  return [
    { x: minX, y: minY }, { x: maxX, y: minY },
    { x: maxX, y: maxY }, { x: minX, y: maxY },
    { x: minX, y: minY },
  ];
}

function trianglePoints(corners) {
  const tri = corners.slice(0, 3);
  return [...tri, tri[0]];
}

// --- Flash animation on snap ---
function flashSnap(stroke) {
  const pts = stroke.points;
  if (pts.length < 2) return;
  const start = performance.now();
  const duration = 350;
  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    const alpha = 0.65 * (1 - t);
    if (alpha <= 0) { redraw(); return; }
    redraw();
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = stroke.size + 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// --- Main recognition entry point ---
function attemptShapeRecognition() {
  if (strokes.length === 0) return;
  const stroke = strokes[strokes.length - 1];
  const pts = stroke.points;
  if (!pts || pts.length < 6) return;

  let snappedPoints = null;

  // 1. Straight line (priority — check first)
  const line = detectLine(pts);
  if (line) snappedPoints = linePoints(line);

  // 2. Circle / ellipse
  if (!snappedPoints) {
    const circle = detectCircle(pts);
    if (circle) snappedPoints = circlePoints(circle);
  }

  // 3. Rectangle / square (exactly 4 corners, ~90° each)
  if (!snappedPoints) {
    const rectCorners = detectRect(pts);
    if (rectCorners) snappedPoints = rectPoints(rectCorners);
  }

  // 4. Triangle (exactly 3 corners)
  if (!snappedPoints) {
    const triCorners = detectTriangle(pts);
    if (triCorners) snappedPoints = trianglePoints(triCorners);
  }

  if (!snappedPoints) return; // No confident match — keep freehand

  const snapped = { points: snappedPoints, color: stroke.color, size: stroke.size };
  strokes[strokes.length - 1] = snapped;
  redraw();
  flashSnap(snapped);

  if (ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'undo' }));
    const n = normaliseStroke(snapped);
    ws.send(JSON.stringify({ type: 'stroke', points: n.points, color: n.color, size: n.size }));
  }

  saveAnnotations();
}

// =====================================================
// SMART CALCULATOR (Gemini API)
// =====================================================

const calcIndicatorEl = document.getElementById('calcIndicator');
const calcBtn = document.getElementById('calcBtn');
let calcWaiting = false;
let calcTimeoutId = null;

function showCalcIndicator(text, cls) {
  calcIndicatorEl.textContent = text;
  calcIndicatorEl.className = cls;
}

function hideCalcIndicator() {
  calcIndicatorEl.className = '';
  calcIndicatorEl.style.opacity = ''; // clear inline style so class-based opacity works next time
  calcWaiting = false;
  calcBtn.textContent = 'Calc';
}

// Capture strokes drawn in the last N seconds and send to Gemini
function attemptCalculation() {
  console.log('[calc] attemptCalculation called, strokes:', strokes.length);
  if (strokes.length === 0) return;

  calcWaiting = true;
  calcBtn.textContent = '...';
  showCalcIndicator('Calculating...', 'loading');

  // Auto-reset after 15 seconds if no response arrives
  clearTimeout(calcTimeoutId);
  calcTimeoutId = setTimeout(() => {
    if (calcWaiting) {
      calcWaiting = false;
      calcBtn.textContent = 'Calc';
      showCalcIndicator('Timed out', 'error');
      setTimeout(hideCalcIndicator, 2000);
    }
  }, 15000);

  // Collect strokes drawn in the last 30 seconds
  const now = Date.now();
  const cutoff = now - 30000;
  const recentStrokes = [];
  for (let i = strokes.length - 1; i >= 0; i--) {
    const s = strokes[i];
    if (s._time && s._time < cutoff) break;
    recentStrokes.unshift(s);
  }
  // Fallback: if no timestamps, use last 30 strokes
  const toCapture = recentStrokes.length > 0 ? recentStrokes : strokes.slice(-30);

  // Find bounding box
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of toCapture) {
    if (s.text) { // text stroke — expand bbox for the text
      const pt = s.points[0];
      minX = Math.min(minX, pt.x);
      minY = Math.min(minY, pt.y - s.size);
      maxX = Math.max(maxX, pt.x + s.size * String(s.text).length * 0.6);
      maxY = Math.max(maxY, pt.y + s.size);
      continue;
    }
    for (const p of (s.points || [])) {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }
  }

  // Add 60px padding
  const pad = 60;
  minX = Math.max(0, minX - pad);
  minY = Math.max(0, minY - pad);
  maxX = maxX + pad;
  maxY = maxY + pad;

  // Enforce minimum capture size of 300×150
  let regionW = maxX - minX;
  let regionH = maxY - minY;
  if (regionW < 300) { const d = (300 - regionW) / 2; minX -= d; maxX += d; regionW = 300; }
  if (regionH < 150) { const d = (150 - regionH) / 2; minY -= d; maxY += d; regionH = 150; }

  // Render at 2x resolution for retina clarity
  const scale = 2;
  const offscreen = document.createElement('canvas');
  offscreen.width = regionW * scale;
  offscreen.height = regionH * scale;
  const offCtx = offscreen.getContext('2d');
  offCtx.fillStyle = '#ffffff';
  offCtx.fillRect(0, 0, offscreen.width, offscreen.height);
  offCtx.scale(scale, scale);
  offCtx.translate(-minX, -minY);

  for (const s of toCapture) {
    if (s.text) {
      const pt = s.points[0];
      offCtx.save();
      offCtx.font = `bold ${s.size}px -apple-system, BlinkMacSystemFont, sans-serif`;
      offCtx.fillStyle = s.color || '#000';
      offCtx.textBaseline = 'middle';
      offCtx.fillText(s.text, pt.x, pt.y);
      offCtx.restore();
      continue;
    }
    const pts = s.points || [];
    if (pts.length < 2) continue;
    offCtx.beginPath();
    offCtx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) offCtx.lineTo(pts[i].x, pts[i].y);
    offCtx.strokeStyle = s.color || '#000';
    offCtx.lineWidth = s.size || 2.5;
    offCtx.lineCap = 'round';
    offCtx.lineJoin = 'round';
    offCtx.stroke();
  }

  // Export as PNG at full 2x resolution
  console.log('[calc] Capturing canvas region...', regionW, 'x', regionH, 'at 2x');
  const dataUrl = offscreen.toDataURL('image/png');
  const base64 = dataUrl.split(',')[1];

  // Position the answer to the right of the rightmost stroke
  const answerX = maxX - pad + 15;
  const answerY = (minY + pad + maxY - pad) / 2;

  console.log('[calc] WebSocket readyState:', ws.readyState);
  console.log('[calc] Sending to server, image size:', base64.length, 'bytes');
  if (ws.readyState === 1) {
    ws.send(JSON.stringify({
      type: 'calculate_math',
      image: base64,
      x: answerX,
      y: answerY,
    }));
  } else {
    console.error('[calc] WebSocket not open — cannot send');
    hideCalcIndicator();
  }
}

// --- Equals-sign detection ---
// Two roughly horizontal strokes of similar length, close together vertically.
function detectEqualsSign() {
  if (strokes.length < 2) {
    console.log('[calc] Stroke check: fewer than 2 strokes');
    return false;
  }
  const cur = strokes[strokes.length - 1];
  const prev = strokes[strokes.length - 2];
  // Skip text strokes
  if (cur.text || prev.text) { console.log('[calc] Stroke check: text stroke — skip'); return false; }
  const curPts = cur.points || [], prevPts = prev.points || [];
  if (curPts.length < 3 || prevPts.length < 3) { console.log('[calc] Stroke check: too few points'); return false; }

  // Measure each stroke's bounding box
  const cXs = curPts.map(p => p.x), cYs = curPts.map(p => p.y);
  const cW = Math.max(...cXs) - Math.min(...cXs);
  const cH = Math.max(...cYs) - Math.min(...cYs);

  const pXs = prevPts.map(p => p.x), pYs = prevPts.map(p => p.y);
  const pW = Math.max(...pXs) - Math.min(...pXs);
  const pH = Math.max(...pYs) - Math.min(...pYs);

  // Both must be roughly horizontal: y-range < 60% of x-range, and x-range > 10px
  const curHoriz = cW > 10 && cH < cW * 0.6;
  const prevHoriz = pW > 10 && pH < pW * 0.6;
  if (!curHoriz || !prevHoriz) {
    console.log(`[calc] Stroke check: not horizontal — cur(w=${cW.toFixed(0)} h=${cH.toFixed(0)} horiz=${curHoriz}) prev(w=${pW.toFixed(0)} h=${pH.toFixed(0)} horiz=${prevHoriz})`);
    return false;
  }

  // Similar length: neither is more than 3× the other
  const lenRatio = Math.max(cW, pW) / Math.min(cW, pW);
  if (lenRatio > 3) {
    console.log(`[calc] Stroke check: length ratio too different — ${lenRatio.toFixed(1)}`);
    return false;
  }

  // Vertically close: midpoints within 1.5× average width
  const curMidY = (Math.min(...cYs) + Math.max(...cYs)) / 2;
  const prevMidY = (Math.min(...pYs) + Math.max(...pYs)) / 2;
  const vGap = Math.abs(curMidY - prevMidY);
  const avgW = (cW + pW) / 2;
  if (vGap < 2 || vGap > avgW * 1.5) {
    console.log(`[calc] Stroke check: vertical gap wrong — gap=${vGap.toFixed(0)} avgW=${avgW.toFixed(0)}`);
    return false;
  }

  // Horizontally overlapping: midpoints within average width
  const curMidX = (Math.min(...cXs) + Math.max(...cXs)) / 2;
  const prevMidX = (Math.min(...pXs) + Math.max(...pXs)) / 2;
  const hDist = Math.abs(curMidX - prevMidX);
  if (hDist > avgW * 0.8) {
    console.log(`[calc] Stroke check: not aligned horizontally — hDist=${hDist.toFixed(0)} avgW=${avgW.toFixed(0)}`);
    return false;
  }

  console.log(`[calc] Equals sign detected! cur(w=${cW.toFixed(0)} h=${cH.toFixed(0)}) prev(w=${pW.toFixed(0)} h=${pH.toFixed(0)}) vGap=${vGap.toFixed(0)} hDist=${hDist.toFixed(0)}`);
  return true;
}

// Calc button handler
calcBtn.addEventListener('click', () => {
  if (calcWaiting) return;
  attemptCalculation();
});

// Draw the answer text on the canvas as a stroke-based text
function drawAnswerOnCanvas(answer, x, y) {
  // Estimate handwriting height from recent strokes (skip last 2 = equals sign)
  const contentStrokes = strokes.filter(s => !s.text).slice(-10, -2);
  let fontSize = 30; // fallback
  if (contentStrokes.length > 0) {
    let minY = Infinity, maxY = -Infinity;
    for (const s of contentStrokes) {
      for (const p of (s.points || [])) {
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
    }
    fontSize = Math.max(24, Math.min(120, (maxY - minY) * 0.9));
  }

  ctx.save();
  ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.fillStyle = currentColor;
  ctx.textBaseline = 'middle';
  ctx.fillText(answer, x, y);
  ctx.restore();

  // Capture the text as a special "text stroke" so it syncs to students and persists
  const textStroke = {
    points: [{ x, y }],
    color: currentColor,
    size: fontSize,
    text: answer,
  };
  strokes.push(textStroke);

  if (ws.readyState === 1) {
    const n = normaliseStroke(textStroke);
    ws.send(JSON.stringify({ type: 'stroke', points: n.points, color: n.color, size: n.size, text: n.text }));
  }

  saveAnnotations();
}

// --- Pinch-to-zoom, two-finger pan, single-finger swipe ---
// All touch handling is on canvasWrap so pointer events on canvas
// (Apple Pencil / mouse) remain completely unaffected.

let activeTouches = {}; // identifier → { x, y }
let swipeStartX = null;

canvasWrap.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    activeTouches[t.identifier] = { x: t.clientX, y: t.clientY };
  }
  // Track swipe start for single-finger PDF page navigation
  if (e.touches.length === 1 && pdfDoc) {
    swipeStartX = e.touches[0].clientX;
  } else {
    swipeStartX = null; // multi-touch cancels any swipe
  }
}, { passive: false });

canvasWrap.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length !== 2) {
    // Keep activeTouches up to date for single-finger moves
    for (const t of e.changedTouches) {
      activeTouches[t.identifier] = { x: t.clientX, y: t.clientY };
    }
    return;
  }

  const t1 = e.touches[0], t2 = e.touches[1];
  const prev1 = activeTouches[t1.identifier];
  const prev2 = activeTouches[t2.identifier];
  if (!prev1 || !prev2) return;

  const prevMidX = (prev1.x + prev2.x) / 2;
  const prevMidY = (prev1.y + prev2.y) / 2;
  const prevDist = Math.hypot(prev2.x - prev1.x, prev2.y - prev1.y);

  const midX = (t1.clientX + t2.clientX) / 2;
  const midY = (t1.clientY + t2.clientY) / 2;
  const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);

  if (prevDist > 0) {
    const newZoom = Math.max(0.5, Math.min(4, zoom * (dist / prevDist)));
    const dz = newZoom / zoom;
    // Zoom around prevMid, then translate to follow the new midpoint
    panX = prevMidX * (1 - dz) + panX * dz + (midX - prevMidX);
    panY = prevMidY * (1 - dz) + panY * dz + (midY - prevMidY);
    zoom = newZoom;
    applyTransform();
    showZoomIndicator();
  }

  activeTouches[t1.identifier] = { x: t1.clientX, y: t1.clientY };
  activeTouches[t2.identifier] = { x: t2.clientX, y: t2.clientY };
}, { passive: false });

canvasWrap.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) delete activeTouches[t.identifier];
  // Single-finger swipe → PDF page change
  if (swipeStartX !== null && pdfDoc && e.touches.length === 0) {
    const diff = e.changedTouches[0].clientX - swipeStartX;
    if (Math.abs(diff) > 80) {
      if (diff < 0) changePage(pdfPageNum + 1);
      else changePage(pdfPageNum - 1);
    }
  }
  swipeStartX = null;
});

canvasWrap.addEventListener('touchcancel', (e) => {
  for (const t of e.changedTouches) delete activeTouches[t.identifier];
  swipeStartX = null;
});

// --- Reset zoom button ---
document.getElementById('resetZoomBtn').addEventListener('click', () => {
  zoom = 1; panX = 0; panY = 0;
  lastViewportSend = 0; // bypass throttle so student sees reset immediately
  applyTransform();
  showZoomIndicator();
});
</script>
