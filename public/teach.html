<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Teacher — Bearded Tutor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }

  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }

  #controls button {
    font-size: 1.2rem;
    padding: 14px 28px;
    border: 2px solid #333;
    border-radius: 12px;
    background: #fff;
    color: #333;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.15s, color 0.15s;
  }

  #controls button:active {
    background: #333;
    color: #fff;
  }

  #controls button.active {
    background: #e74c3c;
    color: #fff;
    border-color: #e74c3c;
  }

  #pauseBtn.active {
    background: #e74c3c;
    color: #fff;
    border-color: #e74c3c;
  }

  /* --- Brush controls --- */
  #brushControls {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }

  .brush-row {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: center;
  }

  .size-btn {
    border: 2px solid transparent;
    border-radius: 50%;
    background: #f0f0f0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    width: 40px;
    height: 40px;
    transition: border-color 0.15s;
  }
  .size-btn.active { border-color: #2196F3; }

  .size-dot {
    border-radius: 50%;
    background: #333;
  }

  .color-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .color-btn.active { border-color: #2196F3; box-shadow: 0 0 0 2px #2196F3; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="brushControls">
  <div class="brush-row" id="sizeRow"></div>
  <div class="brush-row" id="colorRow"></div>
</div>

<div id="controls">
  <button id="pauseBtn">Pause</button>
  <button id="revealBtn">Reveal</button>
  <button id="undoBtn">Undo</button>
  <button id="clearBtn">Clear</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let strokes = [];       // Array of stroke objects: { points, color, size }
let currentStroke = [];
let drawing = false;
let paused = false;

// --- Brush state ---
const SIZES = [
  { name: 'S', value: 2 },
  { name: 'M', value: 5 },
  { name: 'L', value: 10 },
  { name: 'XL', value: 20 },
];
const COLORS = [
  { name: 'Black', value: '#000000' },
  { name: 'Red', value: '#e74c3c' },
  { name: 'Blue', value: '#2196F3' },
  { name: 'Green', value: '#27ae60' },
  { name: 'Orange', value: '#f39c12' },
  { name: 'White', value: '#ffffff' },
];
let currentColor = COLORS[0].value;
let currentSize = SIZES[1].value; // Medium default

// --- Hi-DPI support ---
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
window.addEventListener('resize', resize);
resize();

// --- Drawing helpers ---
function drawStroke(stroke) {
  const pts = stroke.points || stroke;
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.strokeStyle = stroke.color || '#000';
  ctx.lineWidth = stroke.size || 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of strokes) drawStroke(s);
}

// --- Pointer events (Apple Pencil compatible) ---
canvas.addEventListener('pointerdown', (e) => {
  // Only draw with pen or primary mouse button
  if (e.pointerType === 'touch') return; // reject finger on iPad
  e.preventDefault();
  drawing = true;
  currentStroke = [{ x: e.clientX, y: e.clientY }];
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  e.preventDefault();
  const pt = { x: e.clientX, y: e.clientY };
  currentStroke.push(pt);
  // Draw incremental segment
  if (currentStroke.length >= 2) {
    const prev = currentStroke[currentStroke.length - 2];
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(pt.x, pt.y);
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (!drawing) return;
  e.preventDefault();
  drawing = false;
  if (currentStroke.length > 1) {
    const stroke = { points: currentStroke, color: currentColor, size: currentSize };
    strokes.push(stroke);
    sendStroke(stroke);
  }
  currentStroke = [];
});

canvas.addEventListener('pointercancel', () => {
  drawing = false;
  currentStroke = [];
});

// --- WebSocket ---
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}`);

ws.addEventListener('open', () => {
  ws.send(JSON.stringify({ type: 'register', role: 'teacher' }));
});

ws.addEventListener('message', (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'paused') {
    paused = true;
    pauseBtn.classList.add('active');
    pauseBtn.textContent = 'Paused';
  }
});

function sendStroke(stroke) {
  if (ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'stroke', points: stroke.points, color: stroke.color, size: stroke.size }));
  }
}

function getSnapshot() {
  // Export at display resolution
  return canvas.toDataURL('image/png');
}

// --- Buttons ---
const pauseBtn = document.getElementById('pauseBtn');
const revealBtn = document.getElementById('revealBtn');
const undoBtn = document.getElementById('undoBtn');
const clearBtn = document.getElementById('clearBtn');

pauseBtn.addEventListener('click', () => {
  if (!paused) {
    paused = true;
    pauseBtn.classList.add('active');
    pauseBtn.textContent = 'Paused';
    ws.send(JSON.stringify({ type: 'pause', snapshot: getSnapshot() }));
  }
});

revealBtn.addEventListener('click', () => {
  paused = false;
  pauseBtn.classList.remove('active');
  pauseBtn.textContent = 'Pause';
  ws.send(JSON.stringify({ type: 'reveal', snapshot: getSnapshot() }));
});

undoBtn.addEventListener('click', () => {
  if (strokes.length === 0) return;
  strokes.pop();
  redraw();
  ws.send(JSON.stringify({ type: 'undo' }));
});

clearBtn.addEventListener('click', () => {
  strokes = [];
  redraw();
  ws.send(JSON.stringify({ type: 'clear' }));
});

// --- Build brush controls ---
const sizeRow = document.getElementById('sizeRow');
const colorRow = document.getElementById('colorRow');

SIZES.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'size-btn' + (s.value === currentSize ? ' active' : '');
  btn.title = s.name;
  const dot = document.createElement('span');
  dot.className = 'size-dot';
  const d = Math.max(6, Math.min(s.value, 24));
  dot.style.width = d + 'px';
  dot.style.height = d + 'px';
  btn.appendChild(dot);
  btn.addEventListener('click', () => {
    currentSize = s.value;
    sizeRow.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
  sizeRow.appendChild(btn);
});

COLORS.forEach((c) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (c.value === currentColor ? ' active' : '');
  btn.style.background = c.value;
  btn.title = c.name;
  btn.addEventListener('click', () => {
    currentColor = c.value;
    colorRow.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
  colorRow.appendChild(btn);
});
</script>
</body>
</html>
