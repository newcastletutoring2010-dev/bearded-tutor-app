<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bearded Tutor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d1b2a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 32px 20px;
  }

  .logo {
    margin-bottom: 12px;
    font-size: 2.8rem;
  }

  h1 {
    color: #fff;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    text-align: center;
  }

  .tagline {
    color: #7a8fa6;
    font-size: 0.95rem;
    margin-bottom: 56px;
    text-align: center;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 360px;
  }

  .nav a {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px 28px;
    border-radius: 16px;
    text-decoration: none;
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    background: #162536;
    border: 2px solid #1e3448;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    user-select: none;
    -webkit-user-select: none;
  }

  .nav a:active {
    transform: scale(0.97);
  }

  .nav a:hover {
    background: #1e3448;
    border-color: #f07820;
  }

  .nav a .icon {
    font-size: 1.6rem;
    width: 36px;
    text-align: center;
    flex-shrink: 0;
  }

  .nav a .label {
    flex: 1;
  }

  .nav a .arrow {
    color: #f07820;
    font-size: 1.1rem;
    opacity: 0.7;
  }

  .nav a.primary {
    background: #f07820;
    border-color: #f07820;
    color: #fff;
  }

  .nav a.primary:hover {
    background: #d4661a;
    border-color: #d4661a;
  }

  .nav a.primary .arrow {
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>

<div class="logo">&#9998;</div>
<h1>The Bearded Tutor</h1>
<p class="tagline">Live teaching, one canvas at a time.</p>

<nav class="nav">
  <a href="/teach" class="primary">
    <span class="icon">&#9998;</span>
    <span class="label">Whiteboard</span>
    <span class="arrow">&#8594;</span>
  </a>
  <a href="/library">
    <span class="icon">&#128196;</span>
    <span class="label">Library</span>
    <span class="arrow">&#8594;</span>
  </a>
  <a href="/student">
    <span class="icon">&#128065;</span>
    <span class="label">Student View</span>
    <span class="arrow">&#8594;</span>
  </a>
</nav>

</body>
</html>
