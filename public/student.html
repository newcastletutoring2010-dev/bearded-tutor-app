<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Student — Bearded Tutor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

  #panelContainer {
    display: flex;
    width: 100%; height: 100%;
    position: absolute;
    top: 0; left: 0;
  }
  .panel {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .panel.hidden-panel { display: none; }
  .panel .canvasWrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    transition: transform 0.05s linear;
  }
  .panel .pdfCanvas {
    display: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }
  .panel .drawCanvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    touch-action: none;
    z-index: 1;
  }

  #status {
    position: fixed;
    top: 12px;
    right: 16px;
    padding: 6px 14px;
    border-radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  #status.visible {
    opacity: 1;
  }

  #status.paused {
    background: #e74c3c;
    color: #fff;
  }

  #status.live {
    background: #2ecc71;
    color: #fff;
  }

  #pdfStatus {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 14px;
    border-radius: 8px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #pdfStatus.visible { opacity: 1; }

  /* Receives the same CSS zoom/pan transform broadcast by the teacher */
  #canvasWrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    transition: transform 0.05s linear;
  }
</style>
</head>
<body>

<div id="panelContainer">
  <div id="panelLeft" class="panel">
    <div class="canvasWrap" data-panel="left">
      <canvas class="pdfCanvas"></canvas>
      <canvas class="drawCanvas"></canvas>
    </div>
  </div>
  <div id="panelRight" class="panel hidden-panel">
    <div class="canvasWrap" data-panel="right">
      <canvas class="pdfCanvas"></canvas>
      <canvas class="drawCanvas"></canvas>
    </div>
  </div>
</div>
<div id="status"></div>
<div id="pdfStatus"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const statusEl = document.getElementById('status');
const pdfStatusEl = document.getElementById('pdfStatus');

// --- Panel system ---
function initPanel(el) {
  const wrap = el.querySelector('.canvasWrap');
  const draw = el.querySelector('.drawCanvas');
  const pdf = el.querySelector('.pdfCanvas');
  return { el, wrap, canvas: draw, ctx: draw.getContext('2d'), pdfCanvas: pdf, pdfCtx: pdf.getContext('2d'), pageId: null, strokes: [] };
}
const panels = {
  left: initPanel(document.getElementById('panelLeft')),
  right: initPanel(document.getElementById('panelRight')),
};
let isSplitView = false;

let paused = false;

// --- Multi-page state ---
let wbPages = {};
let displayedPageId = null;

// --- Viewport ---
function applyViewport(z, px, py) {
  panels.left.wrap.style.transform = `translate(${px}px, ${py}px) scale(${z})`;
  if (isSplitView) panels.right.wrap.style.transform = `translate(${px}px, ${py}px) scale(${z})`;
}

// --- PDF state ---
let pdfDoc = null;
let pdfPageNum = 1;
let pdfStudent = null;
let pdfFilename = null;

// --- Hi-DPI ---
function resizePanel(p) {
  const dpr = window.devicePixelRatio || 1;
  const rect = p.el.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  if (w === 0 || h === 0) return;
  p.canvas.width = w * dpr; p.canvas.height = h * dpr;
  p.canvas.style.width = w + 'px'; p.canvas.style.height = h + 'px';
  p.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  p.pdfCanvas.width = w * dpr; p.pdfCanvas.height = h * dpr;
  p.pdfCanvas.style.width = w + 'px'; p.pdfCanvas.style.height = h + 'px';
  p.pdfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resize() {
  resizePanel(panels.left);
  if (isSplitView) resizePanel(panels.right);
  redrawPanel('left');
  if (isSplitView) redrawPanel('right');
  if (pdfDoc) renderPdfPage();
}
window.addEventListener('resize', resize);
resize();

// Denormalise using panel dimensions
function denormaliseStroke(s, w, h) {
  w = w || window.innerWidth; h = h || window.innerHeight;
  const out = { points: s.points.map(p => ({ x: p.x * w, y: p.y * h })), color: s.color, size: s.size * h };
  if (s.text) out.text = s.text;
  return out;
}

function denormaliseForPanel(s, side) {
  const rect = panels[side].el.getBoundingClientRect();
  return denormaliseStroke(s, rect.width, rect.height);
}

// --- Drawing ---
function drawStrokeOn(c, stroke) {
  if (stroke.text) {
    const pt = stroke.points[0];
    c.save();
    c.font = `bold ${stroke.size}px -apple-system, BlinkMacSystemFont, sans-serif`;
    c.fillStyle = stroke.color || '#000';
    c.textBaseline = 'middle';
    c.fillText(stroke.text, pt.x, pt.y);
    c.restore();
    return;
  }
  const pts = stroke.points || [];
  if (pts.length < 2) return;
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  c.strokeStyle = stroke.color || '#000';
  c.lineWidth = stroke.size || 2.5;
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.stroke();
}

function redrawPanel(side) {
  const p = panels[side];
  p.ctx.clearRect(0, 0, p.canvas.width, p.canvas.height);
  for (const s of p.strokes) drawStrokeOn(p.ctx, s);
}

// Find which panel(s) display a given pageId
function panelsForPage(pageId) {
  const out = [];
  if (panels.left.pageId === pageId) out.push('left');
  if (isSplitView && panels.right.pageId === pageId) out.push('right');
  return out;
}

function showStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'visible ' + cls;
  clearTimeout(statusEl._timer);
  if (cls === 'live') {
    statusEl._timer = setTimeout(() => {
      statusEl.className = '';
    }, 2000);
  }
}

function showPdfStatus(text) {
  pdfStatusEl.textContent = text;
  pdfStatusEl.classList.add('visible');
  clearTimeout(pdfStatusEl._timer);
  pdfStatusEl._timer = setTimeout(() => {
    pdfStatusEl.classList.remove('visible');
  }, 3000);
}

// --- PDF rendering ---
async function loadPdf(student, filename) {
  pdfStudent = student;
  pdfFilename = filename;
  const url = `/uploads/${encodeURIComponent(student)}/${encodeURIComponent(filename)}`;
  pdfDoc = await pdfjsLib.getDocument(url).promise;
  showPdfStatus(student + ' / ' + filename);
}

async function renderPdfPageOn(side) {
  if (!pdfDoc) return;
  const p = panels[side];
  const pageNum = Math.min(pdfPageNum, pdfDoc.numPages);
  const page = await pdfDoc.getPage(pageNum);
  const rect = p.el.getBoundingClientRect();
  const vw = rect.width, vh = rect.height;
  const pdfViewport = page.getViewport({ scale: 1 });
  const scale = Math.min(vw / pdfViewport.width, vh / pdfViewport.height);
  const viewport = page.getViewport({ scale });

  const dpr = window.devicePixelRatio || 1;
  p.pdfCanvas.width = vw * dpr;
  p.pdfCanvas.height = vh * dpr;
  p.pdfCanvas.style.width = vw + 'px';
  p.pdfCanvas.style.height = vh + 'px';

  const renderCtx = p.pdfCtx;
  renderCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderCtx.clearRect(0, 0, vw, vh);
  renderCtx.translate((vw - viewport.width) / 2, (vh - viewport.height) / 2);

  await page.render({ canvasContext: renderCtx, viewport }).promise;
  p.pdfCanvas.style.display = 'block';
}

async function renderPdfPage() {
  await renderPdfPageOn('left');
}

function closePdf() {
  pdfDoc = null;
  pdfStudent = null;
  pdfFilename = null;
  pdfPageNum = 1;
  for (const side of ['left', 'right']) {
    panels[side].pdfCanvas.style.display = 'none';
    const dpr = window.devicePixelRatio || 1;
    panels[side].pdfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    panels[side].pdfCtx.clearRect(0, 0, panels[side].pdfCanvas.width, panels[side].pdfCanvas.height);
  }
}

// --- WebSocket ---
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}`);

ws.addEventListener('open', () => {
  ws.send(JSON.stringify({ type: 'register', role: 'student' }));
});

ws.addEventListener('message', async (e) => {
  const msg = JSON.parse(e.data);

  switch (msg.type) {
    case 'init': {
      paused = msg.paused;
      if (msg.pages) wbPages = msg.pages;

      // Set up split view state
      isSplitView = !!msg.splitView;
      const leftId = msg.splitView ? msg.splitLeftPageId : (msg.activePageId || 'wb_1');
      const rightId = msg.splitView ? msg.splitRightPageId : null;

      panels.left.pageId = leftId;
      displayedPageId = leftId;

      if (isSplitView && rightId) {
        panels.right.el.classList.remove('hidden-panel');
        panels.right.pageId = rightId;
      } else {
        panels.right.el.classList.add('hidden-panel');
      }

      // Resize and load strokes for each visible panel
      resizePanel(panels.left);
      const lpd = wbPages[leftId];
      panels.left.strokes = lpd ? (lpd.strokes || []).map(s => denormaliseForPanel(s, 'left')) : [];

      if (isSplitView && rightId) {
        resizePanel(panels.right);
        const rpd = wbPages[rightId];
        panels.right.strokes = rpd ? (rpd.strokes || []).map(s => denormaliseForPanel(s, 'right')) : [];
      }

      if (msg.currentViewport) {
        applyViewport(msg.currentViewport.zoom, msg.currentViewport.panX, msg.currentViewport.panY);
      }

      if (msg.currentPdf && msg.currentPdf.student && msg.currentPdf.filename) {
        await loadPdf(msg.currentPdf.student, msg.currentPdf.filename);
        // Render PDF on any panel that shows a PDF page
        for (const side of ['left', 'right']) {
          if (!isSplitView && side === 'right') continue;
          const pm = (panels[side].pageId || '').match(/^pdf_.*_(\d+)$/);
          if (pm && pdfDoc) {
            pdfPageNum = parseInt(pm[1], 10);
            await renderPdfPageOn(side);
            panels[side].pdfCanvas.style.display = 'block';
          }
        }
        showPdfStatus(msg.currentPdf.student + ' / ' + msg.currentPdf.filename);
      }

      if (paused && msg.revealedImage) {
        loadSnapshot(msg.revealedImage);
        showStatus('Paused', 'paused');
      } else {
        redrawPanel('left');
        if (isSplitView) redrawPanel('right');
      }
      break;
    }

    case 'stroke': {
      if (paused) return;
      const sides = msg.pageId ? panelsForPage(msg.pageId) : panelsForPage(displayedPageId);
      if (sides.length === 0) return;
      for (const side of sides) {
        const ds = denormaliseForPanel({ points: msg.points, color: msg.color, size: msg.size, text: msg.text }, side);
        panels[side].strokes.push(ds);
        drawStrokeOn(panels[side].ctx, ds);
      }
      break;
    }

    case 'full-redraw': {
      if (paused) return;
      const sides = msg.pageId ? panelsForPage(msg.pageId) : panelsForPage(displayedPageId);
      for (const side of sides) {
        panels[side].strokes = (msg.strokes || []).map(s => denormaliseForPanel(s, side));
        redrawPanel(side);
      }
      break;
    }

    case 'clear': {
      if (paused) return;
      const sides = msg.pageId ? panelsForPage(msg.pageId) : panelsForPage(displayedPageId);
      for (const side of sides) {
        panels[side].strokes = [];
        redrawPanel(side);
      }
      break;
    }

    case 'paused':
      paused = true;
      showStatus('Paused', 'paused');
      break;

    case 'reveal':
      paused = false;
      showStatus('Live', 'live');
      if (msg.strokes) {
        const sides = panelsForPage(displayedPageId);
        for (const side of sides) {
          panels[side].strokes = msg.strokes.map(s => denormaliseForPanel(s, side));
          redrawPanel(side);
        }
      } else if (msg.snapshot) {
        loadSnapshot(msg.snapshot);
      }
      break;

    case 'wb-page-add':
      break;

    case 'wb-page-change': {
      displayedPageId = msg.pageId;
      panels.left.pageId = msg.pageId;
      const pm = msg.pageId.match(/^pdf_(.+)_(.+)_(\d+)$/);
      if (pm && pdfDoc) {
        pdfPageNum = parseInt(pm[3], 10);
        await renderPdfPageOn('left');
        panels.left.pdfCanvas.style.display = 'block';
        showPdfStatus('Page ' + pdfPageNum);
      } else if (!pm) {
        panels.left.pdfCanvas.style.display = 'none';
        const dpr = window.devicePixelRatio || 1;
        panels.left.pdfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        panels.left.pdfCtx.clearRect(0, 0, panels.left.pdfCanvas.width, panels.left.pdfCanvas.height);
      }
      panels.left.strokes = [];
      redrawPanel('left');
      break;
    }

    case 'wb-split-toggle': {
      isSplitView = msg.enabled;
      if (isSplitView) {
        panels.right.el.classList.remove('hidden-panel');
        panels.right.pageId = msg.rightPageId;
        panels.left.pageId = msg.leftPageId;
        resizePanel(panels.left);
        resizePanel(panels.right);
        const rpd = wbPages[msg.rightPageId];
        panels.right.strokes = rpd ? (rpd.strokes || []).map(s => denormaliseForPanel(s, 'right')) : [];
        // Re-denormalise left panel for new width
        const lpd = wbPages[msg.leftPageId];
        panels.left.strokes = lpd ? (lpd.strokes || []).map(s => denormaliseForPanel(s, 'left')) : [];
        redrawPanel('left');
        redrawPanel('right');
      } else {
        panels.right.el.classList.add('hidden-panel');
        resizePanel(panels.left);
        redrawPanel('left');
      }
      break;
    }

    case 'wb-split-change': {
      const side = msg.panel;
      if (panels[side]) {
        panels[side].pageId = side === 'left' ? (displayedPageId = msg.pageId) : msg.pageId;
        const pd = wbPages[msg.pageId];
        panels[side].strokes = pd ? (pd.strokes || []).map(s => denormaliseForPanel(s, side)) : [];
        redrawPanel(side);
        // Handle PDF rendering for this panel
        const pm = msg.pageId.match(/^pdf_.*_(\d+)$/);
        if (pm && pdfDoc) {
          pdfPageNum = parseInt(pm[1], 10);
          await renderPdfPageOn(side);
          panels[side].pdfCanvas.style.display = 'block';
        } else {
          panels[side].pdfCanvas.style.display = 'none';
        }
      }
      break;
    }

    case 'pdf-load':
      panels.left.strokes = [];
      redrawPanel('left');
      displayedPageId = msg.activePageId || `pdf_${msg.student}_${msg.filename}_${msg.page || 1}`;
      panels.left.pageId = displayedPageId;
      await loadPdf(msg.student, msg.filename);
      pdfPageNum = msg.page || 1;
      await renderPdfPageOn('left');
      panels.left.pdfCanvas.style.display = 'block';
      showPdfStatus(msg.student + ' / ' + msg.filename + ' — Page ' + pdfPageNum);
      break;

    case 'pdf-page':
      panels.left.strokes = [];
      redrawPanel('left');
      displayedPageId = msg.activePageId || displayedPageId;
      panels.left.pageId = displayedPageId;
      pdfPageNum = msg.page;
      if (pdfDoc) {
        await renderPdfPageOn('left');
        showPdfStatus('Page ' + pdfPageNum);
      }
      break;

    case 'pdf-unload':
      panels.left.strokes = [];
      redrawPanel('left');
      closePdf();
      displayedPageId = msg.activePageId || 'wb_1';
      panels.left.pageId = displayedPageId;
      break;

    case 'viewport':
      if (!paused) applyViewport(msg.zoom, msg.panX, msg.panY);
      break;
  }
});

function loadSnapshot(dataUrl) {
  if (!dataUrl) return;
  const img = new Image();
  const c = panels.left.ctx;
  const cv = panels.left.canvas;
  img.onload = () => {
    c.clearRect(0, 0, cv.width, cv.height);
    c.drawImage(img, 0, 0, cv.width, cv.height);
  };
  img.src = dataUrl;
}
</script>
</body>
</html>
