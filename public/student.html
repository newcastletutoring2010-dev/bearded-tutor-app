<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Student — Bearded Tutor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #status {
    position: fixed;
    top: 12px;
    right: 16px;
    padding: 6px 14px;
    border-radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  #status.visible {
    opacity: 1;
  }

  #status.paused {
    background: #e74c3c;
    color: #fff;
  }

  #status.live {
    background: #2ecc71;
    color: #fff;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="status"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

let strokes = [];
let paused = false;

// --- Hi-DPI ---
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
window.addEventListener('resize', resize);
resize();

// --- Drawing ---
function drawStroke(points) {
  if (points.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of strokes) drawStroke(s);
}

function showStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'visible ' + cls;
  clearTimeout(statusEl._timer);
  if (cls === 'live') {
    statusEl._timer = setTimeout(() => {
      statusEl.className = '';
    }, 2000);
  }
}

// --- WebSocket ---
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}`);

ws.addEventListener('open', () => {
  ws.send(JSON.stringify({ type: 'register', role: 'student' }));
});

ws.addEventListener('message', (e) => {
  const msg = JSON.parse(e.data);

  switch (msg.type) {
    case 'init':
      paused = msg.paused;
      if (paused && msg.revealedImage) {
        loadSnapshot(msg.revealedImage);
        showStatus('Paused', 'paused');
      }
      break;

    case 'stroke':
      if (paused) return;
      strokes.push(msg.points);
      drawStroke(msg.points);
      break;

    case 'full-redraw':
      if (paused) return;
      strokes = msg.strokes || [];
      redraw();
      break;

    case 'clear':
      if (paused) return;
      strokes = [];
      redraw();
      break;

    case 'paused':
      paused = true;
      showStatus('Paused', 'paused');
      break;

    case 'reveal':
      paused = false;
      showStatus('Live', 'live');
      if (msg.strokes) {
        strokes = msg.strokes;
        redraw();
      } else if (msg.snapshot) {
        loadSnapshot(msg.snapshot);
      }
      break;
  }
});

function loadSnapshot(dataUrl) {
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  img.src = dataUrl;
}
</script>
</body>
</html>
