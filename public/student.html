<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Student — Bearded Tutor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

  #pdfCanvas {
    display: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  #canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    z-index: 1;
  }

  #status {
    position: fixed;
    top: 12px;
    right: 16px;
    padding: 6px 14px;
    border-radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  #status.visible {
    opacity: 1;
  }

  #status.paused {
    background: #e74c3c;
    color: #fff;
  }

  #status.live {
    background: #2ecc71;
    color: #fff;
  }

  #pdfStatus {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 14px;
    border-radius: 8px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #pdfStatus.visible { opacity: 1; }

  /* Receives the same CSS zoom/pan transform broadcast by the teacher */
  #canvasWrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    transition: transform 0.05s linear;
  }
</style>
</head>
<body>

<div id="canvasWrap">
  <canvas id="pdfCanvas"></canvas>
  <canvas id="canvas"></canvas>
</div>
<div id="status"></div>
<div id="pdfStatus"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const pdfCanvas = document.getElementById('pdfCanvas');
const pdfCtx = pdfCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const pdfStatusEl = document.getElementById('pdfStatus');

let strokes = [];
let paused = false;

// --- Viewport (mirrors teacher zoom/pan) ---
const canvasWrap = document.getElementById('canvasWrap');

function applyViewport(z, px, py) {
  canvasWrap.style.transform = `translate(${px}px, ${py}px) scale(${z})`;
}

// --- PDF state ---
let pdfDoc = null;
let pdfPageNum = 1;
let pdfStudent = null;
let pdfFilename = null;

// --- Hi-DPI ---
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pdfCanvas.width = w * dpr;
  pdfCanvas.height = h * dpr;
  pdfCanvas.style.width = w + 'px';
  pdfCanvas.style.height = h + 'px';
  pdfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
  if (pdfDoc) renderPdfPage();
}
window.addEventListener('resize', resize);
resize();

// --- Drawing ---
function drawStroke(stroke) {
  const pts = stroke.points || stroke;
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.strokeStyle = stroke.color || '#000';
  ctx.lineWidth = stroke.size || 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of strokes) drawStroke(s);
}

function showStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'visible ' + cls;
  clearTimeout(statusEl._timer);
  if (cls === 'live') {
    statusEl._timer = setTimeout(() => {
      statusEl.className = '';
    }, 2000);
  }
}

function showPdfStatus(text) {
  pdfStatusEl.textContent = text;
  pdfStatusEl.classList.add('visible');
  clearTimeout(pdfStatusEl._timer);
  pdfStatusEl._timer = setTimeout(() => {
    pdfStatusEl.classList.remove('visible');
  }, 3000);
}

// --- PDF rendering ---
async function loadPdf(student, filename) {
  pdfStudent = student;
  pdfFilename = filename;
  const url = `/uploads/${encodeURIComponent(student)}/${encodeURIComponent(filename)}`;
  const loadingTask = pdfjsLib.getDocument(url);
  pdfDoc = await loadingTask.promise;
  pdfCanvas.style.display = 'block';
  showPdfStatus(student + ' / ' + filename);
}

async function renderPdfPage() {
  if (!pdfDoc) return;
  const pageNum = Math.min(pdfPageNum, pdfDoc.numPages);
  const page = await pdfDoc.getPage(pageNum);
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const pdfViewport = page.getViewport({ scale: 1 });
  const scale = Math.min(vw / pdfViewport.width, vh / pdfViewport.height);
  const viewport = page.getViewport({ scale });

  const dpr = window.devicePixelRatio || 1;
  pdfCanvas.width = vw * dpr;
  pdfCanvas.height = vh * dpr;
  pdfCanvas.style.width = vw + 'px';
  pdfCanvas.style.height = vh + 'px';

  const renderCtx = pdfCanvas.getContext('2d');
  renderCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderCtx.clearRect(0, 0, vw, vh);

  const offsetX = (vw - viewport.width) / 2;
  const offsetY = (vh - viewport.height) / 2;
  renderCtx.translate(offsetX, offsetY);

  await page.render({
    canvasContext: renderCtx,
    viewport,
  }).promise;
}

function closePdf() {
  pdfDoc = null;
  pdfStudent = null;
  pdfFilename = null;
  pdfPageNum = 1;
  pdfCanvas.style.display = 'none';
  const dpr = window.devicePixelRatio || 1;
  pdfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pdfCtx.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);
}

// --- WebSocket ---
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}`);

ws.addEventListener('open', () => {
  ws.send(JSON.stringify({ type: 'register', role: 'student' }));
});

ws.addEventListener('message', async (e) => {
  const msg = JSON.parse(e.data);

  switch (msg.type) {
    case 'init':
      paused = msg.paused;
      strokes = msg.strokes || [];

      // Apply the teacher's current viewport immediately
      if (msg.currentViewport) {
        applyViewport(msg.currentViewport.zoom, msg.currentViewport.panX, msg.currentViewport.panY);
      }

      // If a PDF is currently loaded, render it first then draw strokes on top
      if (msg.currentPdf && msg.currentPdf.student && msg.currentPdf.filename) {
        await loadPdf(msg.currentPdf.student, msg.currentPdf.filename);
        pdfPageNum = msg.currentPdf.page || 1;
        await renderPdfPage();
        showPdfStatus(msg.currentPdf.student + ' / ' + msg.currentPdf.filename + ' — Page ' + pdfPageNum);
      }

      // If paused, show the frozen snapshot; otherwise draw the live strokes
      if (paused && msg.revealedImage) {
        loadSnapshot(msg.revealedImage);
        showStatus('Paused', 'paused');
      } else {
        redraw();
      }
      break;

    case 'stroke':
      if (paused) return;
      const stroke = { points: msg.points, color: msg.color, size: msg.size };
      strokes.push(stroke);
      drawStroke(stroke);
      break;

    case 'full-redraw':
      if (paused) return;
      strokes = msg.strokes || [];
      redraw();
      break;

    case 'clear':
      if (paused) return;
      strokes = [];
      redraw();
      break;

    case 'paused':
      paused = true;
      showStatus('Paused', 'paused');
      break;

    case 'reveal':
      paused = false;
      showStatus('Live', 'live');
      if (msg.strokes) {
        strokes = msg.strokes;
        redraw();
      } else if (msg.snapshot) {
        loadSnapshot(msg.snapshot);
      }
      break;

    // --- PDF events ---
    case 'pdf-load':
      strokes = [];
      redraw();
      await loadPdf(msg.student, msg.filename);
      pdfPageNum = msg.page || 1;
      await renderPdfPage();
      showPdfStatus(msg.student + ' / ' + msg.filename + ' — Page ' + pdfPageNum);
      break;

    case 'pdf-page':
      strokes = [];
      redraw();
      pdfPageNum = msg.page;
      if (pdfDoc) {
        await renderPdfPage();
        showPdfStatus('Page ' + pdfPageNum);
      }
      break;

    case 'pdf-unload':
      strokes = [];
      redraw();
      closePdf();
      break;

    case 'viewport':
      // Only follow teacher zoom/pan when live — freeze position when paused
      if (!paused) applyViewport(msg.zoom, msg.panX, msg.panY);
      break;
  }
});

function loadSnapshot(dataUrl) {
  if (!dataUrl) return;
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  img.src = dataUrl;
}
</script>
</body>
</html>
